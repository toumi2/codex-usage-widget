name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build universal macOS app
        run: bash ./scripts/release-macos.sh "${RELEASE_TAG#v}"

      - name: Attach downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/release/Codex-Usage-${RELEASE_TAG#v}-macos-universal.zip" \
            "build/release/Codex-Usage-${RELEASE_TAG#v}-macos-universal.zip.sha256" \
            --clobber
