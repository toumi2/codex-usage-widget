name: macOS release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Build universal macOS app
        run: ./scripts/release-macos.sh "${GITHUB_REF_NAME#v}"

      - name: Attach downloads to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "build/release/Codex-Usage-${GITHUB_REF_NAME#v}-macos-universal.zip" \
            "build/release/Codex-Usage-${GITHUB_REF_NAME#v}-macos-universal.zip.sha256" \
            --clobber
